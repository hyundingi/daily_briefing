name: Daily competitor newsletter

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    # 08:10 and 08:25 KST, Monday-Friday. GitHub Actions cron uses UTC.
    - cron: "10 23 * * 0-4"
    - cron: "25 23 * * 0-4"

permissions:
  contents: read

concurrency:
  group: daily-newsletter
  cancel-in-progress: false

jobs:
  validate-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate Python files
        run: python -m py_compile daily_briefing.py src/*.py

  build-newsletter:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate newsletter in Worker and send email
        env:
          WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL || 'https://competitor-newsletter.hyundingi.workers.dev' }}
          WORKER_UPDATE_PASSWORD: ${{ secrets.WORKER_UPDATE_PASSWORD || secrets.UPDATE_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          EMAIL_REQUIRED: "true"
          SEND_EMAIL: "true"
        run: python -m src.worker_newsletter_sender
